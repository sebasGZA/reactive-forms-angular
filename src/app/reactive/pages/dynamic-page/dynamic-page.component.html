<section>
    <h2>Reactive: <small> Dynamics </small></h2>
    <hr />
</section>

<form autocomplete="off" [formGroup]="myForm">
    <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Name</label>
        <div class="col-sm-9">
            <input class="form-control" placeholder="Name" formControlName="name">
            <span class="form-text text-danger">
                error message
            </span>
        </div>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Add</label>
        <div class="col-sm-9">
            <div class="input-group">
                <input class="form-control" placeholder="Add favorite">
                <button class="btn btn-outline-primary" type="button">
                    Add favorite
                </button>
            </div>
        </div>
    </div>

    <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Favorites</label>
        <div class="col-sm-9" formArrayName="favoriteGames">
            @for (favoriteGame of favoriteGames.controls; track $index; let i = $index) {
                <div class="mb-1">
                    <div class="input-group">
                        <input class="form-control" [formControlName]="i">
                        <button class="btn btn-outline-danger" type="button">
                            Delete
                        </button>
                    </div>
                    <span class="form-text text-danger">
                        This field is required
                    </span>
                </div>
            }

        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <button type="submit" class="btn btn-primary float-end">
                <!-- [disabled]="myForm.invalid" -->
                Save
            </button>
        </div>
    </div>
</form>

<section>
    <span>Valid</span>
    <pre>{{ myForm.valid| json }}</pre>
    <br>

    <span>Value</span>
    <pre>{{ myForm.value | json }}</pre>
    <br>

    <span>Add game</span>
    <!-- <pre>{{ 'object' | json }}</pre>
    <pre>{{ 'object' | json }}</pre> -->
</section>
